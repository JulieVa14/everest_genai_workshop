[project]
name = "course-companion-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.35.0",
  "python-multipart==0.0.20",
  "python-dotenv==1.1.1",
  "pydantic==2.11.9",
  "openai==1.109.1",
  "openai-agents==0.2.11",
  "chromadb==1.0.20",
  "pypdf==6.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "httpx==0.28.1",
    "ruff==0.13.2",
    "ipykernel==6.30.1",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# ____ is the fill-in blank students replace in the notebook.
"app/student_code/exercise_*.py" = ["F821"]
